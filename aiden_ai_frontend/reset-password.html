<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Aiden AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Set New Password</h2>
        <form id="reset-password-form">
            <input type="hidden" id="reset-token">
            <div>
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" required minlength="6">
            </div>
            <div>
                <label for="confirm-password">Confirm New Password:</label>
                <input type="password" id="confirm-password" required minlength="6">
            </div>
            <button type="submit" id="reset-button">Reset Password</button>
        </form>
        <div id="reset-page-message" class="message" style="display:none; margin-top: 15px;"></div>
        <p><a href="login.html">Back to Login</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('reset-password-form');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const tokenInput = document.getElementById('reset-token');
            const messageDiv = document.getElementById('reset-page-message');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.style.display = 'block';
            }

            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                tokenInput.value = token;
            } else {
                showMessage('Invalid or missing password reset token. Please request a new link.', 'error');
                resetForm.style.display = 'none'; // Hide form if no token
            }

            if (resetForm) {
                resetForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    const storedToken = tokenInput.value;
                    const newPassword = newPasswordInput.value;
                    const confirmPassword = confirmPasswordInput.value;

                    if (newPassword !== confirmPassword) {
                        showMessage('Passwords do not match.', 'error');
                        return;
                    }
                    if (newPassword.length < 6) {
                         showMessage('Password must be at least 6 characters long.', 'error');
                        return;
                    }
                    if (!storedToken) {
                        showMessage('No reset token found. Please use the link sent to your email.', 'error');
                        return;
                    }

                    showMessage('Resetting your password...', 'info');

                    fetch('http://localhost:8000/users/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ token: storedToken, new_password: newPassword }),
                    })
                    .then(response => {
                        if (!response.ok) {
                           return response.json().then(err => { throw new Error(err.detail || 'Password reset failed') });
                        }
                        return response.json();
                    })
                    .then(data => {
                        showMessage(data.message || 'Password reset successfully! You can now login.', 'success');
                        resetForm.style.display = 'none'; // Hide form on success
                        // Consider redirecting to login after a delay
                        setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                    })
                    .catch(error => {
                        console.error("Reset password error:", error);
                        showMessage(`Password reset failed: ${error.message}`, 'error');
                    });
                });
            }
        });
    </script>
</body>
</html>
