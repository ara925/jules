<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aiden AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Login</h2>
        <form id="login-form">
            <div>
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required>
            </div>
            <div>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required>
            </div>
            <div id="2fa-login-section" style="display:none; margin-top: 10px; margin-bottom: 10px;">
                <label for="login-2fa-code">2FA Code (from your authenticator app):</label>
                <input type="text" id="login-2fa-code" name="login-2fa-code" placeholder="6-digit code" />
            </div>
            <button type="submit" id="login-button">Login</button>
        </form>
        <div id="login-message" class="message" style="display:none; margin-top:15px;"></div>
        <p><a href="request-password-reset.html">Forgot Password?</a></p>
        <p>Don't have an account? <a href="register.html">Register</a></p>
        <p><a href="index.html">Back to Chat</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
