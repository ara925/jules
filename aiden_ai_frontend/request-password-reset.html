<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password Reset - Aiden AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Reset Password</h2>
        <form id="request-reset-form">
            <p>Enter your email address and we will send you a link to reset your password.</p>
            <div>
                <label for="request-email">Email:</label>
                <input type="email" id="request-email" required>
            </div>
            <button type="submit" id="request-reset-button">Send Reset Link</button>
        </form>
        <div id="request-reset-message" class="message" style="display:none; margin-top:15px;"></div>
        <p><a href="login.html">Back to Login</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const requestResetForm = document.getElementById('request-reset-form');
            const emailInput = document.getElementById('request-email');
            const messageDiv = document.getElementById('request-reset-message');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.style.display = 'block';
            }

            if (requestResetForm) {
                requestResetForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    const email = emailInput.value;

                    showMessage('Processing your request...', 'info'); // Optional: provide immediate feedback

                    fetch('http://localhost:8000/users/request-password-reset', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email: email }),
                    })
                    .then(response => response.json()) // Always expect JSON, even for errors if backend sends them
                    .then(data => {
                        // Backend always returns a success-like message here to prevent enumeration
                        showMessage(data.message || 'If your email is registered, you will receive a reset link shortly.', 'success');
                        emailInput.value = ''; // Clear the input
                    })
                    .catch(error => {
                        console.error("Request password reset error:", error);
                        // This catch might not be hit if backend always returns 200 for this endpoint
                        showMessage('An error occurred. Please try again.', 'error');
                    });
                });
            }
        });
    </script>
</body>
</html>
