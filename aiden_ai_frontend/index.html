<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a> |
            <a href="profile.html">Profile</a> |
            <a href="contacts.html">Contacts</a> |
            <a href="inbox.html">Inbox</a> |
            <a href="organization_management.html" id="nav-org-management" style="display:none;">Manage Organization</a> |
            <a href="admin_audit_logs.html" id="nav-admin-audit-logs" style="display:none;">Admin Audit</a>
        </nav>
    </header>
    <div class="page-container">
        <h2>Aiden AI Chat</h2>
        <div id="conversation-join-area" class="auth-container" style="margin-bottom: 20px; width:auto;">
            <input type="text" id="conversation-id-input" placeholder="Enter Conversation ID">
            <button id="join-conversation-button">Join Conversation</button>
        </div>

        <div id="chat-container" style="display:none;">
            <h3 id="current-conversation-id" style="text-align: center; margin-top:0;"></h3>
            <div id="chat-messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Type your message...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
