<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Audit Logs - Aiden AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Chat</a> |
            <a href="contacts.html">Contacts</a> |
            <a href="inbox.html">Inbox</a> |
            <a href="profile.html">Profile</a> |
            <a href="organization_management.html" id="nav-org-management-audit" style="display:none;">Manage Organization</a> |
            <!-- Admin specific nav items can be added here too, controlled by JS -->
            <button id="logout-button-admin-audit" class="nav-button">Logout</button>
        </nav>
    </header>

    <div class="page-container">
        <h1>System Audit Logs</h1>

        <div id="admin-audit-content" style="display: none;"> <!-- Hidden until permission check -->
            <div id="audit-log-filters" class="auth-container" style="margin-bottom: 20px; padding: 15px; text-align:left;">
                <h4>Filters</h4>
                <input type="text" id="filter-user-id" placeholder="Filter by User ID" style="margin-right: 10px; padding: 8px;" />
                <input type="text" id="filter-action" placeholder="Filter by Action" style="margin-right: 10px; padding: 8px;" />
                <input type="text" id="filter-target-type" placeholder="Filter by Target Type" style="margin-right: 10px; padding: 8px;" />
                <button id="apply-filters-btn" class="action-button">Apply Filters</button>
                <button id="reset-filters-btn" class="action-button-secondary">Reset Filters</button>
            </div>

            <table id="audit-logs-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Actor Email (ID)</th>
                        <th>Action</th>
                        <th>Target Type</th>
                        <th>Target ID</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="audit-logs-table-body">
                    <!-- Log rows will be inserted here -->
                </tbody>
            </table>
            <div id="audit-log-pagination" style="margin-top: 20px; text-align: center;">
                <button id="prev-page-btn" class="action-button-secondary" disabled>Previous</button>
                <span id="current-page-display" style="margin: 0 15px;">Page: 1</span>
                <button id="next-page-btn" class="action-button-secondary">Next</button>
            </div>
        </div>
        <div id="admin-audit-messages" class="message" style="display:none; margin-top: 15px;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
